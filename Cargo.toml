[package]
name = "omsrs"
version = "0.4.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Broker-agnostic order management, lifecycle, and simulation primitives"
repository = "https://github.com/wangschien/omsrs"

[features]
default = []
persistence = ["dep:rusqlite"]
statistical-tests = []

[dependencies]
rust_decimal = { version = "1.40", features = ["serde-str"] }
rust_decimal_macros = "1.40"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.9"
serde = { version = "1", features = ["derive"] }
# Keep the upper bound until the MSRV moves beyond Cargo 1.78; newer
# serde_json releases pull edition-2024 transitive crates.
serde_json = ">=1.0.145, <1.0.149"
thiserror = "1"
uuid = { version = "1.10", features = ["v4"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# R11.1 (v0.2): AsyncBroker trait needs async_trait for dyn-compatibility.
# Tiny, zero-runtime crate; added unconditionally so no feature gate is
# required at consumer sites.
async-trait = "0.1"
# R12.5+ (deepseek F2 fix): `Order::save_to_db_async` uses
# `tokio::task::spawn_blocking` to keep sync rusqlite calls off the
# Tokio reactor thread. Only the `rt` feature is needed (no
# multi-thread runtime spawn required for the helper itself —
# consumers bring their own runtime). Kept narrow on purpose.
tokio = { version = "1", features = ["rt"], default-features = false }

[dev-dependencies]
proptest = "=1.4.0"
pretty_assertions = "1.4"
libtest-mimic = "0.7"
# libtest-mimic allows clap 4.x; clap 4.6 is edition 2024 and breaks
# Cargo 1.78 before the MSRV gate can even build.
clap = "=4.5.53"
# Keep proptest's temp-file stack below getrandom 0.4 until the MSRV
# moves beyond Cargo 1.78.
tempfile = "=3.23.0"
toml = "=0.8.23"
# toml_edit allows indexmap 2.x; indexmap 2.12+ requires newer Rust/Cargo
# than the crate's declared MSRV.
indexmap = "=2.11.4"
# R11.2: async parity harness uses #[tokio::test] to mirror the sync
# R4 Paper test_base suite against AsyncPaper.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "rt"] }

[[test]]
name = "parity"
path = "tests/parity/main.rs"
harness = false

[[test]]
name = "parity_runner_smoke"
path = "tests/parity_runner_smoke/main.rs"

[[test]]
name = "statistical"
path = "tests/statistical/main.rs"
harness = false
required-features = ["statistical-tests"]

[lints.rust]
warnings = "deny"
